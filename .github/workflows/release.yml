name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          UPDATE_VERSION="$(node -p "require('./update.json').addons['zotero-github-sync@situkangsayur.github.io'].updates[0].version")"
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ] || [ "$MANIFEST_VERSION" != "$UPDATE_VERSION" ]; then
            echo "manifest.json, package.json and update.json versions must match" >&2
            exit 1
          fi
          TAG="v$MANIFEST_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate checksums
        run: |
          cd build
          sha256sum *.xpi > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: |
            build/*.xpi
            build/SHA256SUMS.txt

      - name: Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            build/*.xpi
            build/SHA256SUMS.txt
            update.json
          generate_release_notes: true
