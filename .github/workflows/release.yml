name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (for example v1.6.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check that the tag matches manifest.json
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v" >&2
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "manifest.json is $MANIFEST_VERSION but the tag is $TAG_VERSION" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate checksums
        run: |
          cd build
          sha256sum *.xpi > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: |
            build/*.xpi
            build/SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            build/*.xpi
            build/SHA256SUMS.txt
            update.json
          generate_release_notes: true
