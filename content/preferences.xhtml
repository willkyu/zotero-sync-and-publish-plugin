<vbox id="zotero-github-sync-prefpane"
		onload="ZoteroGitHubSyncPrefs.init()"
		onunload="ZoteroGitHubSyncPrefs.uninit()">
	<vbox class="main-section">
		<groupbox>
			<label><html:h2>Workspace transport</html:h2></label>
			<hbox align="center">
				<label control="zgs-workspace-transport" value="Transport"/>
				<html:select id="zgs-workspace-transport" preference="extensions.zotero-github-sync.workspaceTransport">
					<html:option value="system-git">System Git (git.exe / git)</html:option>
					<html:option value="github-api">GitHub API</html:option>
				</html:select>
			</hbox>
			<html:div class="zgs-hint">Both choices synchronize the same complete Local Workspace. Only the remote transport changes.</html:div>
			<html:div class="zgs-hint">GitHub API transport uses ordinary Git blobs and skips individual files over 95 MB. Choose System Git when the repository uses Git LFS.</html:div>
		</groupbox>

		<groupbox id="zgs-local-settings">
			<label><html:h2>Workspace</html:h2></label>
			<hbox align="center">
				<label control="zgs-workspace-path" value="Research repository root"/>
				<html:input id="zgs-workspace-path" type="text" flex="1" preference="extensions.zotero-github-sync.workspacePath"/>
				<button label="Choose…" oncommand="ZoteroGitHubSyncPrefs.chooseFolder('workspacePath', 'zgs-workspace-path')"/>
			</hbox>
			<vbox id="zgs-system-git-settings">
				<hbox align="center">
					<label value="Git executable"/><html:input type="text" size="18" preference="extensions.zotero-github-sync.gitExecutable"/>
					<label value="Remote"/><html:input type="text" size="12" preference="extensions.zotero-github-sync.gitRemote"/>
				</hbox>
				<hbox align="center">
					<label value="Branch"/><html:input type="text" size="18" preference="extensions.zotero-github-sync.gitBranch"/>
				</hbox>
			</vbox>
			<hbox align="center">
				<label value="Managed workspace paths"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.managedPaths" placeholder="content,zotero"/>
			</hbox>
			<hbox align="center">
				<label value="Zotero mirror folder"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.basePath" placeholder="zotero"/>
			</hbox>
			<hbox align="center">
				<label value="Reading notes"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.papersPath"/>
				<label value="Note images"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.assetsPath"/>
			</hbox>
			<checkbox label="Sync note images (independent of PDFs)" preference="extensions.zotero-github-sync.includeNoteImagesLocal"/>
			<checkbox label="Sync original PDFs and other literature attachments" preference="extensions.zotero-github-sync.includePDFsLocal"/>
			<checkbox label="Automatically publish managed workspace changes" preference="extensions.zotero-github-sync.autoCommit"/>
			<checkbox id="zgs-system-auto-push" label="Automatically push after a successful system Git commit" preference="extensions.zotero-github-sync.autoPush"/>
			<hbox align="center">
				<label value="Obsidian Vault path"/><html:input id="zgs-vault-path" type="text" flex="1" preference="extensions.zotero-github-sync.obsidianVaultPath"/>
				<button label="Choose…" oncommand="ZoteroGitHubSyncPrefs.chooseFolder('obsidianVaultPath', 'zgs-vault-path')"/>
			</hbox>
			<hbox align="center">
				<label value="Vault name (optional)"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.obsidianVaultName"/>
				<button label="Test open" oncommand="ZoteroGitHubSyncPrefs.testObsidian()"/>
			</hbox>
			<hbox align="center">
				<label value="Default reading-note template"/><html:input id="zgs-template-path" type="text" flex="1" preference="extensions.zotero-github-sync.noteTemplatePath"/>
				<button label="Choose Markdown…" oncommand="ZoteroGitHubSyncPrefs.chooseTemplate()"/>
			</hbox>
			<html:div class="zgs-hint">Applied when “Open Reading Note in Obsidian” creates a new child note, or repairs a completely empty note. Supports {{title}}, {{authors}}, {{year}}, {{date:YYYY-MM-DD}}, Zotero field names, and the variables documented in the Chinese guide.</html:div>
			<hbox>
				<button label="Validate workspace" oncommand="ZoteroGitHubSyncPrefs.testWorkspace()"/>
				<button id="zgs-pause" label="Pause automation" oncommand="ZoteroGitHubSyncPrefs.togglePause()"/>
			</hbox>
			<html:div id="zgs-local-test-status" class="zgs-status"/>
		</groupbox>

		<groupbox id="zgs-github-account">
			<label><html:h2>GitHub account</html:h2></label>

			<html:div class="zgs-hint">
				Create a token at
				<html:span class="zgs-mono">github.com/settings/tokens</html:span>.
				A fine-grained token needs <html:b>Contents: Read and write</html:b> on the
				target repository; a classic token needs the <html:b>repo</html:b> scope.
				The token is stored in Zotero's password manager, not in the preferences file.
			</html:div>

			<hbox align="center">
				<label control="zgs-token" value="Personal access token"/>
				<html:input id="zgs-token" type="password" flex="1"
						placeholder="github_pat_… or ghp_…"/>
			</hbox>

			<hbox align="center" pack="start">
				<button id="zgs-save-token" label="Save token"
						oncommand="ZoteroGitHubSyncPrefs.saveToken()"/>
				<button id="zgs-clear-token" label="Remove token"
						oncommand="ZoteroGitHubSyncPrefs.clearToken()"/>
				<button id="zgs-test" label="Test connection"
						oncommand="ZoteroGitHubSyncPrefs.testConnection()"/>
			</hbox>

			<html:div id="zgs-token-status" class="zgs-status"/>
		</groupbox>

		<groupbox id="zgs-github-repository">
			<label><html:h2>Repository</html:h2></label>

			<hbox align="center">
				<label control="zgs-owner" value="Owner (user or organization)"/>
				<html:input id="zgs-owner" type="text" flex="1"
						preference="extensions.zotero-github-sync.owner"
						placeholder="situkangsayur"/>
			</hbox>

			<hbox align="center">
				<label control="zgs-repo" value="Repository"/>
				<html:input id="zgs-repo" type="text" flex="1"
						preference="extensions.zotero-github-sync.repo"
						placeholder="my-zotero-library"/>
			</hbox>
			<hbox align="center">
				<label value="Branch"/>
				<html:input type="text" size="20" preference="extensions.zotero-github-sync.branch"/>
			</hbox>

			<checkbox label="Create the repository if it does not exist"
					preference="extensions.zotero-github-sync.autoCreateRepo"/>
			<checkbox label="Create it as a private repository"
					preference="extensions.zotero-github-sync.repoPrivate"/>

			<hbox align="center">
				<label control="zgs-api-url" value="API URL (GitHub Enterprise)"/>
				<html:input id="zgs-api-url" type="text" flex="1"
						preference="extensions.zotero-github-sync.apiURL"/>
			</hbox>
		</groupbox>

		<groupbox>
			<label><html:h2>When to sync</html:h2></label>

			<hbox align="center">
				<checkbox id="zgs-interval-enabled" label="Sync every"
						preference="extensions.zotero-github-sync.intervalEnabled"/>
				<html:input id="zgs-interval-minutes" type="text" size="5"
						preference="extensions.zotero-github-sync.intervalMinutes"/>
				<label value="minutes"/>
			</hbox>

			<hbox align="center">
				<label value="Automatically sync saved Zotero and workspace changes after waiting"/>
				<html:input id="zgs-change-delay" type="text" size="5"
						preference="extensions.zotero-github-sync.changeDelayMinutes"/>
				<label value="minutes for edits to settle"/>
			</hbox>

			<checkbox label="Sync shortly after Zotero starts"
					preference="extensions.zotero-github-sync.syncOnStartup"/>

			<checkbox label="Sync the workspace after Zotero's own sync finishes (the sync button in the toolbar)"
					preference="extensions.zotero-github-sync.syncAfterZoteroSync"/>

			<html:div class="zgs-hint">
				Saved local changes always synchronize automatically unless automation is paused.
				A sync that finds nothing to change makes no commit. Short intervals still perform remote checks.
			</html:div>
		</groupbox>

		<groupbox>
			<label><html:h2>Commits</html:h2></label>

			<hbox align="center">
				<label control="zgs-commit-message" value="Message template"/>
				<html:input id="zgs-commit-message" type="text" flex="1"
						preference="extensions.zotero-github-sync.commitMessage"/>
			</hbox>
			<html:div class="zgs-hint">
				Placeholders: <html:span class="zgs-mono">{changes} {added} {updated} {deleted}
				{trigger} {date}</html:span>
			</html:div>

			<hbox align="center">
				<label control="zgs-author-name" value="Commit author name (optional)"/>
				<html:input id="zgs-author-name" type="text" flex="1"
						preference="extensions.zotero-github-sync.authorName"/>
			</hbox>

			<hbox align="center">
				<label control="zgs-author-email" value="Commit author email (optional)"/>
				<html:input id="zgs-author-email" type="text" flex="1"
						preference="extensions.zotero-github-sync.authorEmail"/>
			</hbox>
		</groupbox>

		<groupbox>
			<label><html:h2>Status</html:h2></label>

			<html:div id="zgs-status" class="zgs-status"/>

			<hbox align="center" pack="start">
				<button id="zgs-sync-now" label="Sync now"
						oncommand="ZoteroGitHubSyncPrefs.syncNow()"/>
				<button id="zgs-cancel" label="Cancel sync" hidden="true"
						oncommand="ZoteroGitHubSyncPrefs.cancel()"/>
				<button id="zgs-pull" label="Reconcile remote changes"
						oncommand="ZoteroGitHubSyncPrefs.pull()"/>
				<button id="zgs-open-repo" label="Open workspace or repository"
						oncommand="ZoteroGitHubSyncPrefs.openRepo()"/>
			</hbox>
		</groupbox>

	</vbox>
</vbox>
