<vbox id="zotero-github-sync-prefpane"
		onload="ZoteroGitHubSyncPrefs.init()"
		onunload="ZoteroGitHubSyncPrefs.uninit()">
	<vbox class="main-section">
		<groupbox id="zgs-quick-setup">
			<label><html:h2 data-zgs-i18n="pref.quick.title">Set up a new computer</html:h2></label>
			<html:div class="zgs-hint" data-zgs-i18n="pref.quick.help">
				Choose an empty or existing local folder, paste the repository URL and a Contents: Read and write token.
				The plugin downloads GitHub before any local export, restores Zotero/Better Notes bindings, and configures Obsidian automatically.
			</html:div>
			<hbox align="center">
				<label control="zgs-quick-workspace" value="Local workspace folder" data-zgs-i18n="pref.quick.workspace"/>
				<html:input id="zgs-quick-workspace" type="text" flex="1"/>
				<button label="Choose…" data-zgs-i18n="pref.choose" oncommand="ZoteroGitHubSyncPrefs.chooseQuickFolder()"/>
			</hbox>
			<hbox align="center">
				<label control="zgs-quick-repo" value="GitHub repository URL" data-zgs-i18n="pref.quick.repo"/>
				<html:input id="zgs-quick-repo" type="text" flex="1" placeholder="https://github.com/owner/repository"/>
			</hbox>
			<hbox align="center">
				<label control="zgs-quick-token" value="Personal access token" data-zgs-i18n="pref.token"/>
				<html:input id="zgs-quick-token" type="password" flex="1" placeholder="Leave empty to reuse the saved token" data-zgs-i18n-placeholder="pref.quick.tokenPlaceholder"/>
			</hbox>
			<hbox align="center" pack="start">
				<button id="zgs-quick-run" label="Set up and open Obsidian" data-zgs-i18n="pref.quick.run" oncommand="ZoteroGitHubSyncPrefs.quickSetup()"/>
			</hbox>
			<html:div id="zgs-quick-status" class="zgs-status"/>
			<html:div class="zgs-hint" data-zgs-i18n="pref.quick.advanced">Advanced transport, path and scheduling controls remain available below.</html:div>
		</groupbox>

		<groupbox>
			<label><html:h2 data-zgs-i18n="pref.transport.title">Workspace transport</html:h2></label>
			<hbox align="center">
				<label control="zgs-workspace-transport" value="Transport" data-zgs-i18n="pref.transport.label"/>
				<html:select id="zgs-workspace-transport" preference="extensions.zotero-github-sync.workspaceTransport">
					<html:option value="system-git" data-zgs-i18n="pref.transport.git">System Git (git.exe / git)</html:option>
					<html:option value="github-api" data-zgs-i18n="pref.transport.api">GitHub API</html:option>
				</html:select>
			</hbox>
			<html:div class="zgs-hint" data-zgs-i18n="pref.transport.help">Both choices synchronize the same complete Local Workspace. Only the remote transport changes.</html:div>
			<html:div class="zgs-hint" data-zgs-i18n="pref.transport.limit">GitHub API transport uses ordinary Git blobs and skips individual files over 95 MB. Choose System Git when the repository uses Git LFS.</html:div>
		</groupbox>

		<groupbox id="zgs-local-settings">
			<label><html:h2 data-zgs-i18n="pref.workspace.title">Workspace</html:h2></label>
			<hbox align="center">
				<label control="zgs-workspace-path" value="Research repository root" data-zgs-i18n="pref.workspace.root"/>
				<html:input id="zgs-workspace-path" type="text" flex="1" preference="extensions.zotero-github-sync.workspacePath"/>
				<button label="Choose…" data-zgs-i18n="pref.choose" oncommand="ZoteroGitHubSyncPrefs.chooseFolder('workspacePath', 'zgs-workspace-path')"/>
			</hbox>
			<vbox id="zgs-system-git-settings">
				<hbox align="center">
					<label value="Git executable" data-zgs-i18n="pref.git.executable"/><html:input type="text" size="18" preference="extensions.zotero-github-sync.gitExecutable"/>
					<label value="Remote" data-zgs-i18n="pref.git.remote"/><html:input type="text" size="12" preference="extensions.zotero-github-sync.gitRemote"/>
				</hbox>
				<hbox align="center">
					<label value="Branch" data-zgs-i18n="pref.git.branch"/><html:input type="text" size="18" preference="extensions.zotero-github-sync.gitBranch"/>
				</hbox>
			</vbox>
			<hbox align="center">
				<label value="Managed workspace paths" data-zgs-i18n="pref.workspace.managed"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.managedPaths" placeholder="content,zotero"/>
			</hbox>
			<hbox align="center">
				<label value="Zotero mirror folder" data-zgs-i18n="pref.workspace.mirror"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.basePath" placeholder="zotero"/>
			</hbox>
			<hbox align="center">
				<label value="Reading notes" data-zgs-i18n="pref.workspace.notes"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.papersPath"/>
				<label value="Note images" data-zgs-i18n="pref.workspace.images"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.assetsPath"/>
			</hbox>
			<checkbox label="Sync note images (independent of PDFs)" data-zgs-i18n="pref.workspace.syncImages" preference="extensions.zotero-github-sync.includeNoteImagesLocal"/>
			<checkbox label="Sync original PDFs and other literature attachments" data-zgs-i18n="pref.workspace.syncPDFs" preference="extensions.zotero-github-sync.includePDFsLocal"/>
			<checkbox label="Automatically commit/publish managed paths to GitHub" data-zgs-i18n="pref.workspace.autoCommit" preference="extensions.zotero-github-sync.autoCommit"/>
			<checkbox id="zgs-system-auto-push" label="Automatically push GitHub after a successful system Git commit" data-zgs-i18n="pref.workspace.autoPush" preference="extensions.zotero-github-sync.autoPush"/>
			<hbox align="center">
				<label value="Obsidian Vault path" data-zgs-i18n="pref.obsidian.path"/><html:input id="zgs-vault-path" type="text" flex="1" preference="extensions.zotero-github-sync.obsidianVaultPath"/>
				<button label="Choose…" data-zgs-i18n="pref.choose" oncommand="ZoteroGitHubSyncPrefs.chooseFolder('obsidianVaultPath', 'zgs-vault-path')"/>
			</hbox>
			<hbox align="center">
				<label value="Vault name (optional)" data-zgs-i18n="pref.obsidian.name"/><html:input type="text" flex="1" preference="extensions.zotero-github-sync.obsidianVaultName"/>
				<button label="Test open" data-zgs-i18n="pref.obsidian.test" oncommand="ZoteroGitHubSyncPrefs.testObsidian()"/>
			</hbox>
			<checkbox id="zgs-obsidian-confirm" label="Ask for confirmation before opening Obsidian" data-zgs-i18n="pref.obsidian.confirm" oncommand="ZoteroGitHubSyncPrefs.setObsidianConfirmation(this.checked)"/>
			<html:div id="zgs-obsidian-confirm-help" class="zgs-hint"/>
			<hbox align="center">
				<label value="Default reading-note template" data-zgs-i18n="pref.template.label"/><html:input id="zgs-template-path" type="text" flex="1" preference="extensions.zotero-github-sync.noteTemplatePath"/>
				<button label="Choose Markdown…" data-zgs-i18n="pref.template.choose" oncommand="ZoteroGitHubSyncPrefs.chooseTemplate()"/>
			</hbox>
			<html:div class="zgs-hint" data-zgs-i18n="pref.template.help">Applied when “Open Reading Note in Obsidian” creates a new child note, or repairs a completely empty note. Supports {{title}}, {{authors}}, {{year}}, {{date:YYYY-MM-DD}}, Zotero field names, and the variables documented in the Chinese guide.</html:div>
			<hbox>
				<button label="Validate workspace" data-zgs-i18n="pref.workspace.validate" oncommand="ZoteroGitHubSyncPrefs.testWorkspace()"/>
				<button id="zgs-pause" label="Pause GitHub automation" data-zgs-i18n="pref.automation.pause" oncommand="ZoteroGitHubSyncPrefs.togglePause()"/>
			</hbox>
			<html:div id="zgs-local-test-status" class="zgs-status"/>
		</groupbox>

		<groupbox id="zgs-github-account">
			<label><html:h2 data-zgs-i18n="pref.account.title">GitHub account</html:h2></label>

			<html:div class="zgs-hint" data-zgs-i18n="pref.account.help">
				Create a token at
				<html:span class="zgs-mono">github.com/settings/tokens</html:span>.
				A fine-grained token needs <html:b>Contents: Read and write</html:b> on the
				target repository; a classic token needs the <html:b>repo</html:b> scope.
				The token is stored in Zotero's password manager, not in the preferences file.
			</html:div>

			<hbox align="center">
				<label control="zgs-token" value="Personal access token" data-zgs-i18n="pref.token"/>
				<html:input id="zgs-token" type="password" flex="1"
						placeholder="github_pat_… or ghp_…"/>
			</hbox>

			<hbox align="center" pack="start">
				<button id="zgs-save-token" label="Save token" data-zgs-i18n="pref.token.save"
						oncommand="ZoteroGitHubSyncPrefs.saveToken()"/>
				<button id="zgs-clear-token" label="Remove token" data-zgs-i18n="pref.token.remove"
						oncommand="ZoteroGitHubSyncPrefs.clearToken()"/>
				<button id="zgs-test" label="Test connection" data-zgs-i18n="pref.token.test"
						oncommand="ZoteroGitHubSyncPrefs.testConnection()"/>
			</hbox>

			<html:div id="zgs-token-status" class="zgs-status"/>
		</groupbox>

		<groupbox id="zgs-github-repository">
			<label><html:h2 data-zgs-i18n="pref.repository.title">Repository</html:h2></label>

			<hbox align="center">
				<label control="zgs-owner" value="Owner (user or organization)" data-zgs-i18n="pref.repository.owner"/>
				<html:input id="zgs-owner" type="text" flex="1"
						preference="extensions.zotero-github-sync.owner"
						placeholder="situkangsayur"/>
			</hbox>

			<hbox align="center">
				<label control="zgs-repo" value="Repository" data-zgs-i18n="pref.repository.label"/>
				<html:input id="zgs-repo" type="text" flex="1"
						preference="extensions.zotero-github-sync.repo"
						placeholder="my-zotero-library"/>
			</hbox>
			<hbox align="center">
				<label value="Branch" data-zgs-i18n="pref.git.branch"/>
				<html:input type="text" size="20" preference="extensions.zotero-github-sync.branch"/>
			</hbox>

			<checkbox label="Create the repository if it does not exist" data-zgs-i18n="pref.repository.create"
					preference="extensions.zotero-github-sync.autoCreateRepo"/>
			<checkbox label="Create it as a private repository" data-zgs-i18n="pref.repository.private"
					preference="extensions.zotero-github-sync.repoPrivate"/>

			<hbox align="center">
				<label control="zgs-api-url" value="API URL (GitHub Enterprise)" data-zgs-i18n="pref.repository.apiURL"/>
				<html:input id="zgs-api-url" type="text" flex="1"
						preference="extensions.zotero-github-sync.apiURL"/>
			</hbox>
		</groupbox>

		<groupbox>
			<label><html:h2 data-zgs-i18n="pref.schedule.title">When to sync</html:h2></label>

			<hbox align="center">
				<checkbox id="zgs-interval-enabled" label="Sync every" data-zgs-i18n="pref.schedule.every"
						preference="extensions.zotero-github-sync.intervalEnabled"/>
				<html:input id="zgs-interval-minutes" type="text" size="5"
						preference="extensions.zotero-github-sync.intervalMinutes"/>
				<label value="minutes" data-zgs-i18n="pref.schedule.minutes"/>
			</hbox>

			<hbox align="center">
				<checkbox id="zgs-sync-on-change" label="Sync GitHub after local changes, waiting" data-zgs-i18n="pref.schedule.afterChange"
						preference="extensions.zotero-github-sync.syncOnChange"/>
				<html:input id="zgs-change-delay" type="text" size="5"
						preference="extensions.zotero-github-sync.changeDelayMinutes"/>
				<label value="minutes for edits to settle" data-zgs-i18n="pref.schedule.settle"/>
			</hbox>

			<checkbox label="Sync shortly after Zotero starts" data-zgs-i18n="pref.schedule.startup"
					preference="extensions.zotero-github-sync.syncOnStartup"/>

			<checkbox label="Sync the workspace after Zotero's own sync finishes (the sync button in the toolbar)" data-zgs-i18n="pref.schedule.afterZotero"
					preference="extensions.zotero-github-sync.syncAfterZoteroSync"/>

			<html:div class="zgs-hint" data-zgs-i18n="pref.schedule.help">
				These controls apply only to GitHub. Zotero ↔ local mirror and Zotero note ↔ Obsidian
				always coordinate locally while Zotero is running. Pause GitHub automation affects only GitHub.
			</html:div>
		</groupbox>

		<groupbox>
			<label><html:h2 data-zgs-i18n="pref.commits.title">Commits</html:h2></label>

			<hbox align="center">
				<label control="zgs-commit-message" value="Message template" data-zgs-i18n="pref.commits.message"/>
				<html:input id="zgs-commit-message" type="text" flex="1"
						preference="extensions.zotero-github-sync.commitMessage"/>
			</hbox>
			<html:div class="zgs-hint" data-zgs-i18n="pref.commits.placeholders">
				Placeholders: <html:span class="zgs-mono">{changes} {added} {updated} {deleted}
				{trigger} {date}</html:span>
			</html:div>

			<hbox align="center">
				<label control="zgs-author-name" value="Commit author name (optional)" data-zgs-i18n="pref.commits.authorName"/>
				<html:input id="zgs-author-name" type="text" flex="1"
						preference="extensions.zotero-github-sync.authorName"/>
			</hbox>

			<hbox align="center">
				<label control="zgs-author-email" value="Commit author email (optional)" data-zgs-i18n="pref.commits.authorEmail"/>
				<html:input id="zgs-author-email" type="text" flex="1"
						preference="extensions.zotero-github-sync.authorEmail"/>
			</hbox>
		</groupbox>

		<groupbox>
			<label><html:h2 data-zgs-i18n="pref.status.title">Status</html:h2></label>

			<html:div id="zgs-status" class="zgs-status"/>

			<hbox align="center" pack="start">
				<button id="zgs-sync-now" label="Sync GitHub now" data-zgs-i18n="pref.status.syncNow"
						oncommand="ZoteroGitHubSyncPrefs.syncNow()"/>
				<button id="zgs-cancel" label="Cancel sync" data-zgs-i18n="pref.status.cancel" hidden="true"
						oncommand="ZoteroGitHubSyncPrefs.cancel()"/>
				<button id="zgs-pull" label="Reconcile remote changes" data-zgs-i18n="pref.status.reconcile"
						oncommand="ZoteroGitHubSyncPrefs.pull()"/>
				<button id="zgs-open-repo" label="Open workspace or repository" data-zgs-i18n="pref.status.open"
						oncommand="ZoteroGitHubSyncPrefs.openRepo()"/>
			</hbox>
		</groupbox>

	</vbox>
</vbox>
